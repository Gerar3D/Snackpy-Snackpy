<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Seleccionar Establecimiento</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="agregarEstablecimiento()" aria-label="Agregar establecimiento">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Seleccionar Establecimiento</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="app-logo-section">
    <img src="assets/Logo/Snackpy-500p.png" alt="Snackpy logo" class="app-logo" />
  </div>

  <div class="container">
    <ion-grid>
      <ion-row *ngIf="establecimientos.length === 0">
        <ion-col size="12">
          <ion-card>
            <ion-card-content class="empty-state">
              No hay establecimientos agregados. Presiona + para añadir uno.
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
      <ion-row *ngIf="establecimientos.length > 0">
        <ion-col size="12" *ngFor="let establecimiento of establecimientos">
          <ion-card (click)="seleccionarEstablecimiento(establecimiento)">
            <div class="card-container">
              <div class="logo-container">
                <ion-img [src]="establecimiento.imagenUrl" alt="Logo de {{ establecimiento.nombre }}" class="logo"></ion-img>
              </div>
              <div class="info-container">
                <h2 class="nombre">{{ establecimiento.nombre }}</h2>
                <p class="direccion"><strong>Dirección:</strong> {{ establecimiento.direccion }}</p>
                <p class="telefono" *ngIf="establecimiento.socio?.telefono"><strong>Teléfono:</strong> {{ establecimiento.socio.telefono }}</p>
              </div>
            </div>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
