<ion-header>
  <ion-toolbar>
    <ion-title>Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of items">
      <ion-label>
        <h2>{{ item.nombre }}</h2>
        <p>Cantidad: {{ item.cantidad }}</p>
        <p>Precio: {{ item.precio | currency:'MXN':'symbol':'1.2-2' }}</p>
        <p>Subtotal: {{ (item.precio * item.cantidad) | currency:'MXN':'symbol':'1.2-2' }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" (click)="quitar(item.productoId)">
        Quitar
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-label>
      <h2>Total: {{ total | currency:'MXN':'symbol':'1.2-2' }}</h2>
    </ion-label>
  </ion-item>

  <ion-button expand="block" color="medium" (click)="limpiar()">
    Vaciar Carrito
  </ion-button>
</ion-content>
