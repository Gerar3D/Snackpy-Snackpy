<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="cancelar()" aria-label="Volver al catálogo">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ producto?.nombre || 'Comentario' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="comment-image-wrapper">
    <img [src]="producto?.imagenUrl" alt="{{ producto?.nombre }}" />
  </div>

  <div class="comment-body">
    <P>{{ producto?.descripcion }}</P>
    <p class="comment-instruction">
      Agrega algún comentario, por ejemplo: sin azúcar o sin picante, con carne extra, etc.
    </p>

    <ion-textarea
      [value]="comentario"
      rows="4"
      placeholder="Escribe tu comentario aquí..."
      auto-grow="false"
      (ionInput)="onComentarioChange($event)"
    ></ion-textarea>

    <ion-button expand="block" (click)="guardarComentario()">
      Listo
    </ion-button>
  </div>
</ion-content>
