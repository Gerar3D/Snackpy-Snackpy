<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <div class="header-content">
      <img [src]="establecimientoSeleccionado?.imagenUrl" alt="Logo" class="header-logo" />
      <ion-title>{{ establecimientoSeleccionado?.nombre }}</ion-title>
    </div>
    <ion-buttons slot="end">
      <ion-button (click)="goToCarrito()">
        <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let c of categorias">
        <ion-card button (click)="goToCategoria(c.id)">
          <img [src]="c.categoriaImagenUrl || 'assets/img/default.png'" alt="{{ c.nombre }}" />
          <ion-card-header>
            <ion-card-title>{{ c.nombre }}</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
